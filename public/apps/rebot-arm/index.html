<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111211">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="reBot Arm">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ReBot Arm B601-RS</title>
  <link rel="icon" type="image/png" href="/apps/rebot-arm/favicon.png">
  <link rel="apple-touch-icon" href="/apps/rebot-arm/favicon.png">
  <link rel="manifest" href="/apps/rebot-arm/manifest.webmanifest">
  <link rel="stylesheet" href="/apps/rebot-arm/css/rebot-sim.css?v=20261020-grip24">
</head>
<body>
  <main class="app-shell">
    <section class="viewport" id="viewport">
      <div id="scene-host" class="scene-host"></div>
      <div id="drag-marker" data-i18n-title="app.dragTcp" class="drag-marker" title="拖拽 TCP"></div>

      <header class="hud top-hud">
        <div>
          <p class="eyebrow" data-i18n="app.eyebrow">欢迎来到reBot Arm B601-RS的世界</p>
          <h1 data-i18n="app.title">ReBot Arm B601-RS 机械臂视觉分拣仿真</h1>
        </div>
        <div class="status-pill" id="load-status">
          <span class="status-dot"></span>
          <span data-i18n="app.loading">加载中</span>
        </div>
      </header>

      <div class="hud pose-hud">
        <div>
          <span data-i18n="app.tcp">TCP</span>
          <strong id="tcp-position" data-i18n="app.tcpDefault">X -- / Y -- / Z --</strong>
        </div>
        <div>
          <span data-i18n="app.reach">可达参考</span>
          <strong id="reach-state" data-i18n="app.reachDefault">--</strong>
        </div>
      </div>

      <div class="hud drag-hud" id="drag-hud">
        <span data-i18n="app.dragTarget">拖拽目标</span>
        <strong id="drag-status" data-i18n="app.dragDisabled">未启用</strong>
      </div>

      <div class="hud legend-hud">
        <span><i class="axis x"></i><span data-i18n="app.axisX">ROS +X 前方</span></span>
        <span><i class="axis y"></i><span data-i18n="app.axisY">ROS +Y 左侧</span></span>
        <span><i class="axis z"></i><span data-i18n="app.axisZ">ROS +Z 向上</span></span>
      </div>
    </section>

    <aside class="control-panel">
      <div class="panel-title">
        <div>
          <p class="eyebrow" data-i18n="panel.eyebrow">控制台</p>
          <h2 data-i18n="panel.title">仿真控制台</h2>
        </div>
        <div class="panel-actions">
          <button class="icon-btn" id="reset-camera" data-i18n-title="panel.reset" title="重置视角">↺</button>
          <button class="icon-btn" id="sidebar-collapse" data-i18n-title="panel.collapse" title="折叠侧边栏">◀</button>
        </div>
      </div>

      <!-- 视觉分拣（自动抓取相关按钮）置顶：最常用的操作先看到 -->
      <div class="section task-section">
        <div class="section-head">
          <div>
            <p class="eyebrow" data-i18n="task.eyebrow">Vision</p>
            <h3 data-i18n="task.title">视觉分拣</h3>
          </div>
          <span class="mini-pill online" id="camera-status" data-i18n="task.detecting">识别中</span>
        </div>

        <div class="camera-view" id="camera-view">
          <div class="camera-fallback" data-i18n="task.cameraTitle">实时相机 · 颜色识别</div>
        </div>
        <div class="ros-feedback">
          <span data-i18n="camera.vision">颜色识别</span>
          <strong id="detect-status" data-i18n="task.detectedNone">视野内没有目标</strong>
        </div>
        <div class="ros-feedback">
          <span data-i18n="camera.targetPose">目标 Pose</span>
          <strong id="detect-target">--</strong>
        </div>

        <label class="field-row">
          <span data-i18n="camera.targetColor">目标颜色</span>
          <select id="task-color">
            <option value="auto" data-i18n="camera.colorAuto">自动目标</option>
            <option value="red" data-i18n="camera.colorRed">红色</option>
            <option value="yellow" data-i18n="camera.colorYellow">黄色</option>
            <option value="blue" data-i18n="camera.colorBlue">蓝色</option>
          </select>
        </label>

        <div class="button-grid">
          <button type="button" id="task-move-above" data-i18n="task.moveAbove">移动到目标</button>
          <button type="button" id="task-grasp" data-i18n="task.grasp">抓取</button>
          <button type="button" id="task-release" data-i18n="task.release">松开</button>
        </div>
        <div class="button-grid">
          <button type="button" id="task-pick-place" class="primary-btn" data-i18n="task.pickPlace">抓取并放入盒子</button>
          <button type="button" id="task-auto" data-i18n="task.autoSort">自动分拣</button>
        </div>
        <label class="switch-row">
          <input type="checkbox" id="task-conveyor" checked>
          <span data-i18n="task.conveyor">传送带运行</span>
        </label>
        <div class="ros-feedback">
          <span data-i18n="task.status">状态</span>
          <strong id="task-status" data-i18n="task.stopped">待机中</strong>
        </div>

        <div class="bin-stats" id="bin-stats">
          <div class="bin-chip red"><i></i><strong id="bin-count-red">0</strong></div>
          <div class="bin-chip yellow"><i></i><strong id="bin-count-yellow">0</strong></div>
          <div class="bin-chip blue"><i></i><strong id="bin-count-blue">0</strong></div>
        </div>
      </div>

      <div class="section">
        <h3 data-i18n="joint.title">关节角度</h3>
        <div id="joint-controls" class="joint-list"></div>
      </div>

      <div class="section">
        <h3 data-i18n="action.title">Pose 运动</h3>
        <div class="pose-grid">
          <label><span data-i18n="action.x">X m</span><input id="ros-pose-x" type="number" step="0.005" value="0.40"></label>
          <label><span data-i18n="action.y">Y m</span><input id="ros-pose-y" type="number" step="0.005" value="0.00"></label>
          <label><span data-i18n="action.z">Z m</span><input id="ros-pose-z" type="number" step="0.005" value="0.25"></label>
          <label><span data-i18n="action.duration">时长 s</span><input id="ros-pose-duration" type="number" min="0.4" max="8" step="0.2" value="1.5"></label>
        </div>
        <div class="button-grid">
          <button type="button" id="ros-check-ik" class="primary-btn" data-i18n="action.ik">IK 运动</button>
        </div>
      </div>

      <!-- 姿态预设放最后：属于低频的手动调试入口 -->
      <div class="section">
        <h3 data-i18n="preset.title">姿态预设</h3>
        <div class="button-grid" id="preset-buttons"></div>
        <div class="button-grid">
          <button type="button" id="toggle-drag" data-i18n="adv.drag">启用 TCP 拖拽</button>
          <button type="button" id="stop-path" data-i18n="adv.stop">停止播放/退出拖拽</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="loading-mask" id="loading-mask">
    <div class="loader"></div>
    <p id="loading-text" data-i18n="load.text">正在加载 ReBot Arm B601-RS 机械臂模型...</p>
  </div>

  <script src="/apps/rebot-arm/lib/three-r128.min.js"></script>
  <script src="/apps/rebot-arm/lib/STLLoader-umd.js"></script>
  <script src="/apps/rebot-arm/lib/URDFLoader.js"></script>
  <script src="/apps/rebot-arm/js/pwa.js?v=20261020-grip24"></script>
  <script src="/apps/rebot-arm/js/i18n.js?v=20261020-grip24"></script>
  <script src="/apps/rebot-arm/js/rebot-sim.js?v=20261020-grip24"></script>
  <script src="/apps/rebot-arm/js/rebot-task.js?v=20261020-grip24"></script>
<!-- [AI Hub] 全屏按钮：进入/退出全屏（2026-09-03 v2 醒目版） -->
<button id="pt-fs-btn" type="button"
  style="position:fixed;top:16px;right:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px 10px 14px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:linear-gradient(135deg,#5eead0,#8b7bf0);box-shadow:0 4px 18px rgba(0,0,0,0.45),0 0 0 1px rgba(255,255,255,0.18) inset;
  transition:transform .12s, box-shadow .15s, filter .15s;letter-spacing:0.2px;user-select:none;">
  <svg id="pt-fs-max" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  <svg id="pt-fs-min" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1-2-2h3"/></svg>
  <span id="pt-fs-label">全屏</span>
</button>
<style>
  #pt-fs-btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.12); box-shadow:0 8px 26px rgba(0,0,0,0.5); }
  #pt-fs-btn:active { transform: scale(0.96); }
</style>
<script>
(function () {
  var btn = document.getElementById('pt-fs-btn');
  if (!btn) return;
  var maxIc = document.getElementById('pt-fs-max');
  var minIc = document.getElementById('pt-fs-min');
  var label = document.getElementById('pt-fs-label');
  var _l = (new URLSearchParams(location.search)).get("locale"); var zh = _l ? _l.indexOf("zh") !== -1 : (navigator.language || "").toLowerCase().indexOf("zh") !== -1;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function sync() {
    var fs = isFs();
    maxIc.style.display = fs ? 'none' : '';
    minIc.style.display = fs ? '' : 'none';
    label.textContent = fs ? (zh ? '退出全屏' : 'Exit') : (zh ? '全屏' : 'Fullscreen');
    btn.setAttribute('aria-label', label.textContent);
  }
  function toggle() {
    try {
      if (!isFs()) {
        var el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    } catch (e) {}
  }
  btn.addEventListener('click', function (ev) { ev.stopPropagation(); toggle(); });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>
</body>
</html>
