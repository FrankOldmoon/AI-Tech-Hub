<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机械臂运动学（UAIBot）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #202225; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #scene { width: 100vw; height: 100vh; display: block; }
    .panel {
      position: fixed; top: 14px; left: 14px; width: 250px; z-index: 90;
      background: rgba(255,255,255,0.94); border-radius: 12px; padding: 14px 14px 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35); color: #1f2328; user-select: none;
    }
    .panel h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: #0f1115; }
    .panel .sub { font-size: 11px; color: #6a737d; margin-bottom: 10px; line-height: 1.5; }
    .joint { margin-bottom: 7px; }
    .joint .row { display: flex; justify-content: space-between; font-size: 11px; color: #444; margin-bottom: 2px; }
    .joint .row b { color: #0f1115; }
    .joint input[type=range] { width: 100%; height: 18px; accent-color: #2f81f7; cursor: pointer; }
    .readout {
      border-top: 1px solid #e3e6ea; margin-top: 8px; padding-top: 8px;
      font-size: 12px; line-height: 1.7; color: #24292f;
    }
    .readout .xyz { font-family: ui-monospace, Consolas, monospace; background: #f6f8fa; border-radius: 6px; padding: 5px 8px; font-size: 11px; }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; }
    .btn {
      flex: 1; border: none; border-radius: 8px; padding: 7px 0; font-size: 12px; cursor: pointer; font-weight: 600;
    }
    .btn.reset { background: #2f81f7; color: #fff; }
    .btn.reset:hover { background: #1f6feb; }
    .note {
      position: fixed; bottom: 10px; left: 14px; z-index: 90; font-size: 11px; color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.45); padding: 5px 10px; border-radius: 6px; max-width: 70%;
    }
    .model-name { position: fixed; top: 14px; right: 70px; z-index: 90; font-size: 12px; color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 8px; }
  </style>
  <!-- three / mathjs 全本地：import map 映射到 lib/vendor -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/vendor/build/three.module.js",
      "three/addons/": "./lib/vendor/examples/jsm/",
      "mathjs": "./lib/vendor/mathjs.esm.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="model-name" id="modelName">KUKA KR5 · 6-DoF 串联机械臂</div>

  <div class="panel">
    <h1>关节空间控制</h1>
    <div class="sub">拖动 6 个关节角（单位：度），观察机械臂在<b>关节空间</b>的运动与末端位姿（正运动学）。</div>
    <div id="joints"></div>
    <div class="readout">
      末端位姿（FKM）：<br>
      <div class="xyz" id="pose">x: - -&nbsp;&nbsp;y: - -&nbsp;&nbsp;z: - -</div>
    </div>
    <div class="btn-row">
      <button class="btn reset" id="resetBtn">复位</button>
    </div>
  </div>

  <div class="note">⚠️ 这是<b>运动学几何演示</b>（关节角→末端位姿），非碰撞/动力学/真实硬件仿真。</div>

  <script type="module" src="./main.js"></script>
<!-- [AI Hub] 全屏按钮：进入/退出全屏（2026-09-03 v2 醒目版） -->
<button id="pt-fs-btn" type="button"
  style="position:fixed;top:16px;right:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px 10px 14px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:linear-gradient(135deg,#5eead0,#8b7bf0);box-shadow:0 4px 18px rgba(0,0,0,0.45),0 0 0 1px rgba(255,255,255,0.18) inset;
  transition:transform .12s, box-shadow .15s, filter .15s;letter-spacing:0.2px;user-select:none;">
  <svg id="pt-fs-max" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  <svg id="pt-fs-min" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
  <span id="pt-fs-label">全屏</span>
</button>
<style>
  #pt-fs-btn:hover { transform: translateY(-2px) scale(1.05); filter: brightness(1.12); box-shadow:0 8px 26px rgba(0,0,0,0.5); }
  #pt-fs-btn:active { transform: scale(0.96); }
</style>
<script>
(function () {
  var btn = document.getElementById('pt-fs-btn');
  if (!btn) return;
  var maxIc = document.getElementById('pt-fs-max');
  var minIc = document.getElementById('pt-fs-min');
  var label = document.getElementById('pt-fs-label');
  var zh = (navigator.language || '').toLowerCase().indexOf('zh') !== -1;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function sync() {
    var fs = isFs();
    maxIc.style.display = fs ? 'none' : '';
    minIc.style.display = fs ? '' : 'none';
    label.textContent = fs ? (zh ? '退出全屏' : 'Exit') : (zh ? '全屏' : 'Fullscreen');
    btn.setAttribute('aria-label', label.textContent);
  }
  function toggle() {
    try {
      if (!isFs()) {
        var el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    } catch (e) {}
  }
  btn.addEventListener('click', function (ev) { ev.stopPropagation(); toggle(); });
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>

</body>
</html>
